<body><div id="app" class="app"></div><div id="toast" class="toast"></div>
<script>
const state={role:'buyer',page:'landing',demand:{crop:'Tomatoes',quantity:120,quality:'A',price:30,location:'Pune',date:'Tomorrow',slot:'10 AM – 2 PM'},step:1,order:false,tracking:2,listing:null};
const farmers=[['Khed Farmer Group','Khed, Pune','42 km',250,27,96,96,'Tomorrow • 12:45 PM'],['Satara FPO','Satara','78 km',500,25,91,94,'Tomorrow • 2:10 PM'],['Baramati FPO','Baramati','96 km',300,26,88,92,'Tomorrow • 3:05 PM'],['Mulshi Farmer Group','Mulshi','34 km',180,29,87,97,'Tomorrow • 1:20 PM']];
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function go(page){state.page=page;state.step=1;render();window.scrollTo(0,0)}
function Landing(){return `<div class="landing"><nav class="nav"><div class="brand"><i></i>FarmDirect</div><div class="navlinks"><button onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'})">How it works</button><button onclick="go('analytics')">AI intelligence</button><button onclick="go('login')">Sign in</button></div><button class="primary" onclick="go('buyer-dashboard')">Explore Marketplace</button></nav><main><section class="hero"><div><span class="eyebrow">● Built for direct agricultural trade</span><h1>Direct from Farm.<br><span>Smarter Matching.</span><br>Better Prices.</h1><p>FarmDirect connects farmers and buyers directly through AI-powered demand intelligence, smart matching and third-party logistics.</p><div class="actions"><button class="primary green" onclick="go('demand')">Explore Marketplace →</button><button class="outline" onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'})">See how it works</button></div><div class="trust"><div><strong>2,400+</strong>Verified producers</div><div><strong>98.2%</strong>Fulfilment success</div><div><strong>₹18L+</strong>Farmer value created</div></div></div><div class="flowcard"><div class="flowhead"><b>Live matching workflow</b><span>● Demo mode</span></div><div class="flow"><div class="node">🌾<b>FARMER / FPO</b><small>Verified supply</small></div><div class="arrow">→</div><div class="node">🏢<b>BULK BUYER</b><small>120 kg tomatoes</small></div><div class="ai-node">✦ AI DEMAND + SMART MATCH <span>96% COMPATIBLE</span></div><div class="node">✓<b>COMPLIANCE</b><small>Configured rules checked</small></div><div class="arrow">→</div><div class="node">🚚<b>3PL PARTNER</b><small>Route optimized</small></div></div></div></section><section class="section"><div class="section-title"><span class="eyebrow">One direct platform</span><h2>Market intelligence that moves fresh produce.</h2><p>Transparent pricing, qualified matches and logistics orchestration—without FarmDirect ever owning your produce.</p></div><div class="features"><article class="feature"><div class="icon">✦</div><h3>AI demand intelligence</h3><p>Forecast local demand so growers list what buyers need.</p></article><article class="feature"><div class="icon">⌘</div><h3>Smart matching</h3><p>Rank supply by quantity, distance, price, quality and reliability.</p></article><article class="feature"><div class="icon">✓</div><h3>Compliance by design</h3><p>Configured state-rule eligibility checks before an order locks.</p></article><article class="feature"><div class="icon">↗</div><h3>3PL orchestration</h3><p>Coordinate optimized pickup and delivery with third-party partners.</p></article></div></section><section class="dark-section" id="how"><div class="section"><div class="section-title"><span class="eyebrow">The FarmDirect journey</span><h2>From field to buyer, with clarity at every handoff.</h2></div><div class="steps"><div class="step"><b>01</b><h3>List or request</h3><p>Farmers publish available produce. Buyers place demand.</p></div><div class="step"><b>02</b><h3>Predict</h3><p>Prototype forecasts expose supply and demand gaps.</p></div><div class="step"><b>03</b><h3>Match</h3><p>Compatible local partners are ranked transparently.</p></div><div class="step"><b>04</b><h3>Check</h3><p>Transaction eligibility is checked against configured rules.</p></div><div class="step"><b>05</b><h3>Deliver</h3><p>A 3PL fulfils an optimized direct route.</p></div></div></div></section><section class="footercta"><h2>Ready to make the next direct connection?</h2><p>Use the guided demo to experience the full buyer journey in under two minutes.</p><button class="primary green" onclick="go('demand')">Start Demo Journey →</button></section></main></div>`}
function Sidebar(){let farmer=state.role==='farmer', items=farmer?[['▦','Dashboard','farmer-dashboard'],['▣','My Produce','produce'],['◒','Demand Insights','analytics'],['⌘','Matches','matches'],['□','Orders','orders'],['◉','Profile','farmer-dashboard']]:[['▦','Dashboard','buyer-dashboard'],['⌕','Marketplace','demand'],['＋','My Demands','demand'],['⌘','Matches','matches'],['□','Orders','orders'],['◉','Tracking','logistics'],['◎','Profile','buyer-dashboard']];return `<aside class="side"><div class="brand"><i></i>FarmDirect</div><div class="role-pill">${farmer?'FARMER / FPO':'BUYER WORKSPACE'}</div><nav class="snav">${items.map(x=>`<button class="${state.page===x[2]?'active':''}" onclick="go('${x[2]}')">${x[0]}　${x[1]}</button>`).join('')}</nav><div class="sidefoot">Demo environment<button onclick="switchRole()">⇄ Switch role</button></div></aside>`}
function Layout(content,title){return `<div class="shell">${Sidebar()}<main class="main"><header class="topbar"><h2>${title}</h2><div class="topright"><span class="demo">● SIH DEMO MODE</span><button class="ghost" onclick="toast('3 notifications: demand matched, 3PL assigned, pickup scheduled')">♧</button><div class="avatar">${state.role==='farmer'?'RK':'AM'}</div></div></header><div class="content">${content}</div>${MobileNav()}</main></div>`}
function MobileNav(){return `<nav class="mobile-nav"><button class="${state.page.includes('dashboard')?'active':''}" onclick="go('${state.role==='farmer'?'farmer-dashboard':'buyer-dashboard'}')"><b>▦</b>Home</button><button class="${state.page==='demand'||state.page==='produce'?'active':''}" onclick="go('${state.role==='farmer'?'produce':'demand'}')"><b>＋</b>${state.role==='farmer'?'List':'Demand'}</button><button class="${state.page==='matches'?'active':''}" onclick="go('matches')"><b>⌘</b>Matches</button><button class="${state.page==='logistics'?'active':''}" onclick="go('logistics')"><b>◉</b>Track</button></nav>`}
function Dashboard(){let farmer=state.role==='farmer';let stats=farmer?[['ACTIVE LISTINGS',state.listing?'9':'8','↑ 2 this week'],['ACTIVE DEMANDS NEAR YOU','14','Pune West'],['MATCHED ORDERS','3','↑ 1 today'],['EST. ORDER VALUE','₹42,500','This month']]:[['ACTIVE DEMANDS','3','1 awaiting action'],['MATCHED FARMERS','8','↑ 3 new matches'],['ACTIVE ORDERS','2','On schedule'],['DELIVERY ETA','2h 15m','Next delivery']];return Layout(`<div class="greeting"><div><h1>${farmer?'Good morning, Ramesh 👋':'What do you need today?'}</h1><p>${farmer?'Here is the latest demand signal around your farm.':'Source fresh produce directly from verified farmers.'}</p></div><button class="primary green" onclick="go('${farmer?'produce':'demand'}')">${farmer?'＋ List Produce':'＋ Place New Demand'}</button></div><div class="stats">${stats.map(x=>`<article class="stat"><small>${x[0]}</small><b>${x[1]}</b><span class="up">${x[2]}</span></article>`).join('')}</div><div class="dashboard-grid"><section class="card chart"><div class="card-title"><div><h3>${farmer?'AI Demand Insights':'Demand activity'}</h3><span>Prototype forecast • Pune region</span></div><span class="chip">+18% trend</span></div><div class="bars">${[55,70,59,82,78,95,88].map((h,i)=>`<div class="bar" style="height:${h}%" data-day="${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}"></div>`).join('')}</div></section><section class="card"><div class="card-title"><div><h3>AI recommendations</h3><span>Based on configured demo data</span></div></div>${farmer?`<div class="insight"><div class="icon">🍅</div><div><b>Tomatoes</b><p>Pune West • next 2 weeks</p></div><span class="trend">↑ 18%</span></div><div class="insight"><div class="icon">🥬</div><div><b>Spinach</b><p>High local demand signal</p></div><span class="trend">↑ 23%</span></div><div class="insight"><div class="icon">🧅</div><div><b>Onions</b><p>Stable supply position</p></div><span class="trend">↑ 9%</span></div>`:`<div class="insight"><div class="icon">✓</div><div><b>Verified farmer matches</b><p>8 growers can fulfil your recurring demand</p></div></div><div class="insight"><div class="icon">↗</div><div><b>Best delivery window</b><p>Tomorrow, 10 AM – 2 PM</p></div></div><div class="insight"><div class="icon">✦</div><div><b>Price intelligence</b><p>Tomato prices are steady this week</p></div></div>`}</section></div><div class="notice"><div class="icon">✦</div><div><h3>AI recommendation</h3><p>${farmer?'Demand for spinach is expected to increase in your area over the next 3 weeks.':'Create a demand request to see transparent, AI-assisted farmer matches.'}</p></div></div>`,farmer?'Farmer dashboard':'Buyer dashboard')}
function Demand(){let d=state.demand;let content=state.step===4?`<h2>Review your demand</h2><p>Confirm the details before finding compatible farmer supply.</p><div class="producepreview"><b>${d.crop}</b><p>${d.quantity} kg • Quality ${d.quality} • max ₹${d.price}/kg</p><span class="tag">${d.location}</span><span class="tag">${d.date}</span><span class="tag">${d.slot}</span></div>`:`<h2>${['What product do you need?','Set a fair price','When should it arrive?'][state.step-1]}</h2><p>${['Describe your required produce and quality.','Set the maximum produce price you are comfortable with.','We will match readiness and delivery windows.'][state.step-1]}</p><div class="fields">${state.step===1?`<div class="field"><label>Crop</label><select onchange="state.demand.crop=this.value"><option>Tomatoes</option><option>Onions</option><option>Spinach</option></select></div><div class="field"><label>Quantity (kg)</label><input type="number" value="${d.quantity}" onchange="state.demand.quantity=this.value"></div><div class="field"><label>Quality requirement</label><select><option>Quality A</option><option>Quality B</option></select></div><div class="field"><label>Buyer type</label><select><option>Bulk buyer</option><option>Household</option></select></div>`:state.step===2?`<div class="field"><label>Maximum price / kg</label><input type="number" value="${d.price}" onchange="state.demand.price=this.value"></div><div class="field"><label>Delivery budget</label><input value="₹2,000" readonly></div>`:`<div class="field"><label>Delivery location</label><input value="Pune" onchange="state.demand.location=this.value"></div><div class="field"><label>Delivery date</label><select><option>Tomorrow</option><option>Day after tomorrow</option></select></div><div class="field"><label>Preferred window</label><select><option>10 AM – 2 PM</option><option>2 PM – 6 PM</option></select></div><div class="field"><label>Handling notes</label><input placeholder="Optional notes"></div>`}</div>`;return Layout(`<div class="pagehead"><span class="eyebrow">Buyer workflow</span><h1>Place a new demand</h1><p>Tell us what you need. FarmDirect will find compatible nearby supply.</p></div><div class="formwrap"><section class="formcard"><div class="stepper">${[1,2,3,4].map(x=>`<span class="stepdot ${x<=state.step?'on':''}"></span>`).join('')}</div><small class="chip">STEP ${state.step} OF 4</small>${content}<div class="formactions">${state.step>1?'<button class="outline" onclick="state.step--;render()">Back</button>':'<span></span>'}<button class="primary green" onclick="${state.step===4?'findMatches()':'state.step++;render()'}">${state.step===4?'Find Best Matches →':'Continue →'}</button></div></section><aside class="card preview"><h3>Why this helps</h3><p style="color:var(--muted);line-height:1.6">Our prototype matching checks crop, available quantity, location, price, quality and delivery compatibility.</p><div class="notice" style="margin-top:18px"><div>✦</div><div><h3>AI-assisted matching</h3><p>Ranked, explainable results.</p></div></div></aside></div>`,'New demand')}
function findMatches(){toast('Analyzing nearby supply…');setTimeout(()=>go('matches'),700)}
function Matches(){return Layout(`<div class="pagehead"><span class="eyebrow">AI-assisted matching — prototype</span><h1>AI-Ranked Farmer Matches</h1><p>Based on crop, quantity, location, price, quality and delivery requirements.</p></div><div class="filter"><button class="on" onclick="sortMatches('score',this)">Best Match</button><button onclick="sortMatches('price',this)">Lowest Price</button><button onclick="sortMatches('distance',this)">Closest</button><button onclick="sortMatches('reliability',this)">Highest Reliability</button></div><div id="matchlist" class="matches">${farmerCards(farmers)}</div>`,'Matches')}
function farmerCards(list){return list.map((x,i)=>`<article class="match"><div class="score" style="--score:${x[5]}"><b>${x[5]}%</b></div><div><h3>${x[0]} ${i===0?'<span class="tag">AI MATCH</span>':''}</h3><p>${x[1]} • ${x[2]} away • Ready ${x[7]}</p><div class="matchmeta"><span>${x[3]} kg available</span><span>Quality A</span><span>${x[6]}% reliable</span><span>✓ Verified</span></div></div><div class="matchprice"><small>₹${x[4]}/kg • Delivery ₹1,840</small><button class="primary" onclick="go('match-detail')">View Match</button></div></article>`).join('')}
function sortMatches(kind,el){let i=kind==='price'?4:kind==='distance'?2:kind==='reliability'?6:5;let a=[...farmers].sort((x,y)=>kind==='distance'?parseInt(x[i])-parseInt(y[i]):x[i]-y[i]);document.querySelector('#matchlist').innerHTML=farmerCards(a);document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function MatchDetail(){let scores=[['Quantity compatibility',100],['Distance',92],['Price',98],['Quality',95],['Reliability',96]];return Layout(`<div class="pagehead"><span class="eyebrow">Rank #1 • AI Match</span><h1>Khed Farmer Group</h1><p>Transparent match explanation for your 120 kg tomato demand.</p></div><div class="detail"><section class="card"><div class="match" style="padding:0;border:0"><div class="score" style="--score:96"><b>96%</b></div><div><h3>Excellent match</h3><p>Verified FPO • Khed, Pune • 42 km away</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="fields"><div><small style="color:var(--muted)">AVAILABLE QUANTITY</small><b style="display:block;margin-top:4px">250 kg</b></div><div><small style="color:var(--muted)">PRODUCE PRICE</small><b style="display:block;margin-top:4px">₹27/kg</b></div><div><small style="color:var(--muted)">EST. DELIVERY</small><b style="display:block;margin-top:4px">Tomorrow • 12:45 PM</b></div><div><small style="color:var(--muted)">DELIVERY CHARGE</small><b style="display:block;margin-top:4px">₹1,840</b></div></div><h3 style="margin:24px 0 14px">Match-score breakdown</h3><div class="breakdown">${scores.map(x=>`<div class="metric"><label>${x[0]} <span>${x[1]}%</span></label><div class="track"><span style="width:${x[1]}%"></span></div></div>`).join('')}</div></section><aside class="pricebox"><h3>Order estimate</h3><p>120 kg Tomatoes • Quality A</p><div class="total">₹5,080</div><p>Produce ₹3,240<br>Estimated delivery ₹1,840</p><button class="primary green" onclick="go('compliance')">Proceed to Compliance →</button></aside></div>`,'Match details')}
function Compliance(){let checks=['Applicable rules checked','Commodity eligibility checked','Direct-sale pathway checked','Permission requirements checked','Market fee conditions checked','FSSAI conditions checked','Transport conditions checked'];return Layout(`<div class="compliance"><div class="pagehead"><span class="eyebrow">State-compliance engine</span><h1>State compliance check</h1><p>Eligibility check based on configured state rules.</p></div><section class="card"><div class="notice" style="margin:0 0 20px"><div>✓</div><div><h3>Configured rule assessment complete</h3><p>Maharashtra • Tomatoes • Bulk direct sale</p></div></div><div class="checklist">${checks.map(x=>`<div class="check">✓　${x}</div>`).join('')}</div><div class="eligible"><h3>✓ TRANSACTION ELIGIBLE</h3><p>Direct-sale pathway is available in this prototype scenario.</p></div><p class="disclaimer">Prototype eligibility assessment — verify applicable rules before real transactions. FarmDirect does not provide legal advice.</p><button class="primary green" style="margin-top:18px" onclick="go('confirm')">Continue to Confirmation →</button></section></div>`,'Compliance check')}
function Confirm(){return Layout(`<section class="card" style="max-width:620px"><div class="pagehead"><span class="eyebrow">Order review</span><h1>Order summary</h1><p>Review the direct transaction before it becomes locked.</p></div><div class="producepreview"><b>Tomatoes <span class="tag">QUALITY A</span></b><p>120 kg from Khed Farmer Group</p><div class="fields"><div>Produce price<br><b>₹3,240</b></div><div>Estimated delivery<br><b>₹1,840</b></div><div>Delivery<br><b>Tomorrow</b></div><div>Time<br><b>12:45 PM</b></div></div></div><div class="notice"><div>✓</div><div><h3>Compliance passed</h3><p>Configured state rules have been checked.</p></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><div><small style="color:var(--muted)">TOTAL</small><b style="font:800 27px Manrope;display:block">₹5,080</b></div><button class="primary green" onclick="confirmOrder()">Confirm Order →</button></div></section>`,'Confirm order')}
function confirmOrder(){state.order=true;go('success')}
function Success(){return Layout(`<section class="success"><div class="bigcheck">✓</div><h1>Order confirmed</h1><p><b>Order #FD-2026-00124</b><br>Your order has been locked and a logistics request has been created.</p><div class="actions" style="justify-content:center"><button class="primary green" onclick="go('logistics')">Track Delivery →</button><button class="outline" onclick="go('orders')">View Order</button></div></section>`,'Order confirmed')}
function Logistics(){let s=['Logistics request created','Vehicle assigned','Route optimized','Pickup pending','In transit','Delivered'];return Layout(`<div class="pagehead"><span class="eyebrow">3PL orchestration</span><h1>Smart Logistics</h1><p>Third-party partner assignment and route planning for order #FD-2026-00124.</p></div><div class="logistics"><section class="card route"><div class="routepath"><div class="place">📍 FARM<br><small>Khed • 42 km</small></div><div class="line"></div><div class="truck">🚚</div><div class="place end">📍 BUYER<br><small>Pune • 12:45 PM</small></div></div></section><section class="card"><div class="card-title"><div><h3>3PL Partner Assigned</h3><span>Demo Logistics Partner • Mini truck</span></div><span class="chip">ASSIGNED</span></div><div class="timeline">${s.map((x,i)=>`<button class="tline ${i<state.tracking?'done':''} ${i===state.tracking?'current':''}" onclick="state.tracking=${i};render()">${i<state.tracking?'✓ ':''}${x}${i===state.tracking?' • Current':''}</button>`).join('')}</div></section></div><div class="stats" style="margin-top:17px"><article class="stat"><small>PICKUP ETA</small><b>32 min</b><span class="up">Time-window ready</span></article><article class="stat"><small>DELIVERY ETA</small><b>2h 15m</b><span class="up">Tomorrow • 12:45 PM</span></article><article class="stat"><small>DELIVERY COST</small><b>₹1,840</b><span class="up">Optimized quote</span></article><article class="stat"><small>OPTIMIZATION</small><b style="font-size:16px;margin-top:13px">Shortest feasible route</b><span class="up">Capacity respected</span></article></div>${state.tracking>=5?`<div class="card" style="margin-top:17px;max-width:500px"><h3>Order delivered ✓</h3><p style="color:var(--muted);margin:7px 0 14px">Your feedback helps improve future matching.</p><div class="rating" onclick="toast('Thanks! Demo reliability value updated.')">★★★★★</div><button class="primary green" style="margin-top:12px" onclick="toast('Feedback submitted. Thank you!')">Submit Feedback</button></div>`:''}`,'Delivery tracking')}
function Produce(){return Layout(`<div class="pagehead"><span class="eyebrow">Farmer supply</span><h1>List available produce</h1><p>Publish availability so nearby buyer demand can find you.</p></div><div class="formwrap"><section class="formcard"><h2>Produce details</h2><p>Complete the essentials to generate a live listing preview.</p><div class="fields"><div class="field"><label>Crop</label><select><option>Tomatoes</option><option>Spinach</option><option>Onions</option></select></div><div class="field"><label>Quantity (kg)</label><input value="250"></div><div class="field"><label>Quality grade</label><select><option>Quality A</option><option>Quality B</option></select></div><div class="field"><label>Price / kg</label><input value="27"></div><div class="field"><label>Ready date</label><input value="Tomorrow"></div><div class="field"><label>Pickup window</label><input value="8 AM – 11 AM"></div><div class="field"><label>Farm location</label><input value="Khed, Pune"></div></div><button class="primary green" style="margin-top:22px" onclick="state.listing=true;toast('Listing published — now available for matching');go('farmer-dashboard')">Publish Listing</button></section><aside class="card preview"><h3>Live listing preview</h3><div class="producepreview"><b>Tomatoes</b><p>250 kg • Quality A<br>₹27/kg • Ready tomorrow</p><span class="tag">Pickup: 8 AM – 11 AM</span></div></aside></div>`,'Produce listing')}
function Analytics(){return Layout(`<div class="pagehead"><span class="eyebrow">Prototype forecast</span><h1>AI demand intelligence</h1><p>Historical versus predicted local demand. These are deterministic demo values, not live ML predictions.</p></div><div class="filter"><button class="on">Tomatoes</button><button>Onions</button><button>Spinach</button><button>14 days</button></div><div class="dashboard-grid"><section class="card chart"><div class="card-title"><div><h3>Demand forecast — Pune West</h3><span>Historical (solid) + prototype forecast</span></div></div><div class="bars">${[42,48,51,56,64,68,75,81,88,92].map((h,i)=>`<div class="bar" style="height:${h}%" data-day="${i<5?'Actual':'Forecast'}"></div>`).join('')}</div></section><section class="card"><h3>Forecast signals</h3><div class="insight"><div class="icon">🍅</div><div><b>Expected demand</b><p>Tomatoes • next 2 weeks</p></div><span class="trend">5.0 t</span></div><div class="insight"><div class="icon">⌘</div><div><b>Current supply</b><p>Eligible local listings</p></div><span class="trend">4.3 t</span></div><div class="insight"><div class="icon">↗</div><div><b>Predicted price trend</b><p>Demo market signal</p></div><span class="trend">+18%</span></div></section></div><div class="notice"><div class="icon">✦</div><div><h3>Prototype insight</h3><p>Tomato demand is expected to rise 18%. Spinach demand spike expected next week; onion supply is currently 12% above predicted demand.</p></div></div>`,'Analytics')}
function Orders(){return Layout(`<div class="pagehead"><span class="eyebrow">Order management</span><h1>Orders</h1><p>Direct orders and their current fulfillment state.</p></div><section class="card" style="max-width:880px"><div class="match"><div class="icon">🍅</div><div><h3>FD-2026-00124 <span class="tag">${state.order?'CONFIRMED':'DRAFT'}</span></h3><p>Khed Farmer Group • 120 kg Tomatoes • ₹5,080 total</p></div><div><button class="primary" onclick="go('${state.order?'logistics':'demand'}')">${state.order?'Track delivery':'Continue demo'}</button></div></div></section>`,'Orders')}
function Login(){return `<div class="landing"><nav class="nav"><div class="brand"><i></i>FarmDirect</div><button class="ghost" onclick="go('landing')">← Back to home</button></nav><main class="section" style="max-width:650px"><div class="card" style="padding:30px"><span class="eyebrow">Demo access</span><h1 style="font-size:30px;margin:12px 0 7px">Who are you?</h1><p style="color:var(--muted);margin-bottom:21px">Choose a workspace to explore the complete FarmDirect workflow.</p><div class="features" style="grid-template-columns:1fr 1fr"><button class="feature" onclick="state.role='farmer';go('farmer-dashboard')"><div class="icon">🌾</div><h3>Farmer / FPO</h3><p>List produce and view demand signals.</p></button><button class="feature" onclick="state.role='buyer';go('buyer-dashboard')"><div class="icon">🏢</div><h3>Consumer / Bulk Buyer</h3><p>Place demand and source direct.</p></button></div></div></main></div>`}
function switchRole(){state.role=state.role==='buyer'?'farmer':'buyer';go(state.role==='buyer'?'buyer-dashboard':'farmer-dashboard');toast('Workspace switched')}
function render(){let p=state.page, html=p==='landing'?Landing():p==='login'?Login():p==='buyer-dashboard'||p==='farmer-dashboard'?Dashboard():p==='demand'?Demand():p==='matches'?Matches():p==='match-detail'?MatchDetail():p==='compliance'?Compliance():p==='confirm'?Confirm():p==='success'?Success():p==='logistics'?Logistics():p==='produce'?Produce():p==='analytics'?Analytics():Orders();document.querySelector('#app').innerHTML=html}render();
</script></body></html>
